name: ci
on:
  push:
  pull_request:
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: make test
      - name: gates must reject what they should reject
        run: make eval
      - name: proxy smoke (cache reuse, prefix guard, budget stop)
        run: make smoke
      - name: loop against proxy (written stop reason)
        run: make demo-loop
